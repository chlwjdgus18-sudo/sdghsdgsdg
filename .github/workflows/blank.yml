name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Unzip sources
        run: unzip -o '*.zip' -d /tmp/work

      - name: Build
        working-directory: /tmp/work/teampicker
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: teampicker-jar
          path: /tmp/work/teampicker/build/libs/*.jar
